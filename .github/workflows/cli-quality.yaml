name: CLI Quality

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: K8s Stack Tooling
            project: .
            needs_base: false
          - name: Package Checker
            project: cli_tools/package_checker
            needs_base: true
          - name: Media Downloader Uploader
            project: cli_tools/media_downloader_uploader
            needs_base: false
          - name: OpenBao Stack Setup
            project: cli_tools/openbao_stack_setup
            needs_base: false
    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Checkout platform contracts
        if: matrix.needs_base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: neurwerk/k8s_stack_base
          path: base
          token: ${{ github.token }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen ty check

      - name: Test
        run: uv run --frozen pytest

      - name: Build
        run: uv build

  required_ci:
    name: Required CI
    needs: quality
    if: ${{ always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Report required CI result
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" ]]; then
            printf 'CLI quality matrix result was %s, expected success.\n' \
              "$QUALITY_RESULT" >&2
            exit 1
          fi
