# =============================================================================
# Build and push k8s-stack-tooling image to GHCR
#
# Triggers:
#   - tag v* -> builds and tags as :<semver>
# =============================================================================
name: Build and Push

on:
  push:
    tags: ["v*"]

concurrency:
  group: tooling-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: neurwerk/k8s-stack-tooling

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate tag and root project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            printf 'Release tag must match vX.Y.Z exactly: %s\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          RELEASE_VERSION="${BASH_REMATCH[1]}" python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["RELEASE_VERSION"]
          with Path("pyproject.toml").open("rb") as file:
              project_version = tomllib.load(file)["project"]["version"]
          with Path("uv.lock").open("rb") as file:
              lock = tomllib.load(file)
          locked_version = next(
              package["version"]
              for package in lock["package"]
              if package["name"] == "k8s-stack-tooling"
          )

          versions = {
              "release tag": expected,
              "pyproject.toml": project_version,
              "uv.lock": locked_version,
          }
          if any(version != expected for version in versions.values()):
              raise SystemExit(
                  "Root release versions are not aligned: "
                  + ", ".join(f"{source}={version}" for source, version in versions.items())
              )
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Verify root lockfile
        run: uv lock --check

  quality:
    name: Run repository quality gates
    uses: ./.github/workflows/cli-quality.yaml

  build:
    needs: [validate, quality]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Inspect existing full version
        id: inspect
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          IMAGE_NAME: ghcr.io/neurwerk/k8s-stack-tooling
        run: |
          FULL_IMAGE="$IMAGE_NAME:${GITHUB_REF_NAME#v}"
          set +e
          manifest_json="$(
            docker buildx imagetools inspect "$FULL_IMAGE" \
              --format '{{json .Manifest}}' 2>&1
          )"
          inspect_status=$?
          set -e
          if (( inspect_status != 0 )); then
            if [[ "$manifest_json" == *"not found"* ]] || \
               [[ "$manifest_json" == *"manifest unknown"* ]]; then
              printf '%s\n' "Full version image is absent: $FULL_IMAGE"
              printf 'exists=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "$manifest_json" >&2
            printf '%s\n' "Could not safely determine whether $FULL_IMAGE exists" >&2
            exit 1
          fi

          digest="$(jq -er '.digest | select(type == "string")' <<< "$manifest_json")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' "Existing image manifest has an invalid digest: $digest" >&2
            exit 1
          fi
          image_json="$(
            docker buildx imagetools inspect "$IMAGE_NAME@$digest" \
              --format '{{json .Image}}'
          )"
          if ! jq -e '.os == "linux" and .architecture == "amd64"' \
            <<< "$image_json" >/dev/null; then
            printf '%s\n' "Existing image has no valid linux/amd64 image config" >&2
            exit 1
          fi
          revision="$(
            jq -er '.config.Labels["org.opencontainers.image.revision"] | select(type == "string")' \
              <<< "$image_json"
          )"
          if [[ "$revision" != "$EXPECTED_REVISION" ]]; then
            printf 'Existing image revision %s does not match tagged commit %s\n' \
              "$revision" "$EXPECTED_REVISION" >&2
            exit 1
          fi
          printf '%s\n' "Reusing $FULL_IMAGE@$digest"
          {
            printf 'exists=true\n'
            printf 'digest=%s\n' "$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.inspect.outputs.exists == 'false'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image digest
        id: resolve
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.inspect.outputs.digest }}
          IMAGE_EXISTS: ${{ steps.inspect.outputs.exists }}
        run: |
          if [[ "$IMAGE_EXISTS" == "true" ]]; then
            digest="$EXISTING_DIGEST"
          else
            digest="$BUILT_DIGEST"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' "Could not resolve a valid image digest" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"

      - name: Build and verify shared Python distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          # uv 0.12.7 provides this standalone interpreter for pure-Python packaging.
          uv python install 3.12.14
          # Pin the isolated build backend and all its dependencies, not runtime dependencies.
          cat > "$RUNNER_TEMP/build-constraints.txt" <<'EOF'
          hatchling==1.27.0
          packaging==26.3
          pathspec==1.1.1
          pluggy==1.7.0
          trove-classifiers==2026.9.21.13
          EOF
          for output in python-dist python-dist-repeat; do
            uv build --python 3.12.14 \
              --build-constraint "$RUNNER_TEMP/build-constraints.txt" \
              --out-dir "$RUNNER_TEMP/$output"
          done
          python3 - <<'PY'
          import hashlib
          import os
          import tarfile
          import tomllib
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          if project["version"] != version or project["name"] != "k8s-stack-tooling":
              raise SystemExit("Tagged source and Python package version disagree")
          root = Path(os.environ["RUNNER_TEMP"])
          dist, repeat = root / "python-dist", root / "python-dist-repeat"
          wheel = f"k8s_stack_tooling-{version}-py3-none-any.whl"
          sdist = f"k8s_stack_tooling-{version}.tar.gz"
          with zipfile.ZipFile(dist / wheel) as archive:
              metadata = archive.read(f"k8s_stack_tooling-{version}.dist-info/METADATA")
          with tarfile.open(dist / sdist) as archive:
              stream = archive.extractfile(f"k8s_stack_tooling-{version}/PKG-INFO")
              if stream is None:
                  raise SystemExit("Source distribution has no package metadata")
              source_metadata = stream.read()
          for payload in (metadata, source_metadata):
              parsed = BytesParser().parsebytes(payload)
              if (parsed["Name"], parsed["Version"], parsed["Requires-Python"]) != (
                  project["name"], version, project["requires-python"]
              ):
                  raise SystemExit("Distribution metadata does not match tagged project")
          checksums = []
          for name in sorted((wheel, sdist)):
              payload = (dist / name).read_bytes()
              if payload != (repeat / name).read_bytes():
                  raise SystemExit("Repeated Python distribution builds differ")
              checksums.append(f"{hashlib.sha256(payload).hexdigest()}  {name}\n")
          (dist / "SHA256SUMS").write_text("".join(checksums))
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' "image publication did not return a valid digest" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          image_tag="ghcr.io/neurwerk/k8s-stack-tooling:$version"
          image_digest_ref="ghcr.io/neurwerk/k8s-stack-tooling@$IMAGE_DIGEST"
          image_row="| \`$image_tag\` | \`$image_digest_ref\` |"
          release_exists=false
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
            existing_notes="$(
              gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json body \
                --jq .body
            )"
            if [[ "$existing_notes" == *"$image_row"* ]]; then
              printf '%s\n' "GitHub Release $RELEASE_TAG already has current image notes"
              exit 0
            fi
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq .body > "$RUNNER_TEMP/generated-notes.md"
          {
            printf '## Published Image\n\n'
            printf '| Version tag | Manifest digest |\n'
            printf '| --- | --- |\n'
            printf '| `%s` | `%s` |\n\n' "$image_tag" "$image_digest_ref"
            cat "$RUNNER_TEMP/generated-notes.md"
          } > "$RUNNER_TEMP/release-notes.md"
          if [[ "$release_exists" == "true" ]]; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "K8s Stack Tooling $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "K8s Stack Tooling $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      # Separate from the notes step: its unchanged-notes early exit must not skip assets.
      - name: Publish immutable Python release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          dist="$RUNNER_TEMP/python-dist"
          existing="$(mktemp -d "$RUNNER_TEMP/python-release-existing.XXXXXX")"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets > "$existing/assets.json"
          for name in "k8s_stack_tooling-$version-py3-none-any.whl" \
                      "k8s_stack_tooling-$version.tar.gz" SHA256SUMS; do
            count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' \
              "$existing/assets.json")"
            if [[ "$count" == 1 ]]; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "$name" --dir "$existing"
              if ! cmp --silent "$dist/$name" "$existing/$name"; then
                printf 'Existing release asset differs; refusing replacement: %s\n' "$name" >&2
                exit 1
              fi
              printf 'Reusing identical release asset: %s\n' "$name"
            elif [[ "$count" == 0 ]]; then
              gh release upload "$RELEASE_TAG" "$dist/$name" --repo "$GITHUB_REPOSITORY"
            else
              printf 'Duplicate release asset name: %s\n' "$name" >&2
              exit 1
            fi
          done
