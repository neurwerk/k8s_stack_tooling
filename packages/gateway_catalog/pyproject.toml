[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "k8s-stack-gateway-catalog"
version = "0.1.0"
description = "Provider-neutral gateway catalog contracts and local values helpers."
authors = [{ name = "neurwerk", email = "dev@neurwerk.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_stack_gateway_catalog"]

[dependency-groups]
dev = ["ruff>=0.15.17", "ty>=0.0.49", "pytest>=8"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
