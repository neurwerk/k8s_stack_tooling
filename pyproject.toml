[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "k8s-stack-tooling"
version = "0.15.6"
description = "Kubernetes operational utilities and on-demand maintenance pages."
readme = "README.md"
authors = [{ name = "neurwerk", email = "dev@neurwerk.com" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md", "src/k8s_stack_tooling/maintenance/assets/OFL.txt"]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "kubernetes>=36.0.3,<37",
    "gunicorn>=26.2",
    "pydantic-settings>=2.10",
    "pydantic>=2.10,<3",
    "defusedxml>=0.7.1",
    "ldap3>=2.9,<3",
    "cryptography>=46",
    "PyYAML>=6.0,<7",
    "pyOpenSSL>=25.3",
]

[project.scripts]
maintenance-server = "k8s_stack_tooling.maintenance.main:main"
upsert-realm = "k8s_stack_tooling.keycloak.upsert_realm:main"
upsert-oidc-client = "k8s_stack_tooling.keycloak.upsert_oidc_client:main"
upsert-scoped-oidc-client = "k8s_stack_tooling.keycloak.scoped_oidc:main"
upsert-scoped-service-client = "k8s_stack_tooling.keycloak.scoped_service:main"
upsert-realm-roles = "k8s_stack_tooling.keycloak.upsert_realm_roles:main"
upsert-active-directory = "k8s_stack_tooling.keycloak.upsert_active_directory:main"
upsert-user = "k8s_stack_tooling.keycloak.upsert_user:main"
send-user-actions-email = "k8s_stack_tooling.keycloak.send_user_actions_email:main"
upsert-composite-roles = "k8s_stack_tooling.keycloak.upsert_composite_roles:main"
upsert-opensearch-user = "k8s_stack_tooling.opensearch.upsert_opensearch_user:main"
opensearch-glitchtip-adapter = "k8s_stack_tooling.opensearch_glitchtip.main:main"
ldap-directory-worker = "k8s_stack_tooling.ldap_directory:main"
agentgateway-trust-publish = "k8s_stack_tooling.agentgateway_trust:main"
addon-check = "k8s_stack_tooling.addons:main"
addon-acquire = "k8s_stack_tooling.addons.acquisition:main"
addon-project = "k8s_stack_tooling.addons.sources:projection_main"
agentgateway-observe = "k8s_stack_tooling.agentgateway_observe:main"
stage-documentdb-provisioner = "k8s_stack_tooling.postgres.documentdb:main"
provision-glitchtip = "k8s_stack_tooling.glitchtip.provision:main"
gateway-model-metadata = "k8s_stack_tooling.gateway_model_metadata_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_stack_tooling"]

[tool.hatch.build.targets.sdist]
exclude = ["cli_tools/"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ty]

[tool.ty.src]
include = ["src", "tests"]
# The standalone payload and native acceptance harness run with upstream Python/Django, not Tooling.
exclude = ["src/k8s_stack_tooling/glitchtip/payload.py", "tests/glitchtip_native"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["ruff>=0.15.17", "ty>=0.0.49", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/neurwerk/k8s_stack_tooling"
Repository = "https://github.com/neurwerk/k8s_stack_tooling"
Issues = "https://github.com/neurwerk/k8s_stack_tooling/issues"
Security = "https://github.com/neurwerk/k8s_stack_tooling/security/policy"
