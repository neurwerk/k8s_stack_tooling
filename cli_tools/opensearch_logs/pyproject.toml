[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opensearch-logs"
version = "0.1.0"
description = "Read indexed Kubernetes logs through an OpenSearch port-forward."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
opensearch-logs = "opensearch_logs.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opensearch_logs"]

[dependency-groups]
dev = ["ruff>=0.15.17", "ty>=0.0.49"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ty.src]
include = ["src"]
