[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openbao-stack-setup"
version = "0.6.5"
description = "Initialize and operate neurwerk OpenBao installations from a trusted workstation."
readme = "README.md"
authors = [{ name = "neurwerk", email = "dev@neurwerk.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "kubernetes>=36.0.2",
    "PyYAML>=6.0",
    "questionary>=2.1",
    "requests>=2.31",
]

[project.scripts]
stack-setup = "openbao_stack_setup.main:main"

[project.urls]
Homepage = "https://github.com/neurwerk/k8s_stack_tooling/tree/main/cli_tools/openbao_stack_setup"
Repository = "https://github.com/neurwerk/k8s_stack_tooling"
Issues = "https://github.com/neurwerk/k8s_stack_tooling/issues"
Security = "https://github.com/neurwerk/k8s_stack_tooling/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/openbao_stack_setup"]

[tool.hatch.build.targets.sdist]
exclude = ["src/openbao_stack_setup/glitchtip_payload.py"]

[tool.hatch.build.targets.sdist.force-include]
# Dereference the shared resource into the standalone source archive.
"../../src/k8s_stack_tooling/glitchtip/payload.py" = "src/openbao_stack_setup/glitchtip_payload.py"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.15.17",
    "ty>=0.0.49",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C90", "BLE", "G", "S", "ANN", "D",
    "RUF", "FA", "SIM", "RET", "PTH", "C4", "TRY", "T20",
]
ignore = ["D203", "D212", "TRY003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S", "T20", "TRY003"]
"**/__init__.py" = ["D104"]
# This operator CLI intentionally prints status and starts a validated kubectl executable.
"src/openbao_stack_setup/main.py" = ["S404", "S603", "T201"]
# This module invokes the resolved local gpg executable without a shell.
"src/openbao_stack_setup/custody.py" = ["S603"]
# The native payload's outer security boundary redacts all upstream exceptions and owns CLI output.
"src/openbao_stack_setup/glitchtip_payload.py" = ["BLE001", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["openbao_stack_setup"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.rules]
all = "error"

[tool.ty.src]
# This symlinked resource executes only inside the pinned upstream image.
exclude = ["src/openbao_stack_setup/glitchtip_payload.py"]

[tool.ty.analysis]
strict-literal-narrowing = true

[tool.pytest.ini_options]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
