[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "active-directory"
version = "0.1.0"
description = "Read-only directory access report through an existing Kubernetes tunnel."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6,<7", "rich>=14,<15"]

[project.scripts]
active-directory = "active_directory.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/active_directory"]

[dependency-groups]
dev = ["ruff>=0.15.17", "ty>=0.0.49"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ty.src]
include = ["src"]
