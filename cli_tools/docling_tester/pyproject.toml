[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "docling-tester"
version = "0.1.0"
description = "Check document conversion and gateway attachments against pinned Docling fixtures."
license = "MIT"
license-files = ["LICENSE", "src/docling_tester/upstream/LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "docling>=2,<3",
    "httpx>=0.28.1,<0.29",
]

[project.scripts]
docling-tester = "docling_tester.cli:main"

[project.urls]
Repository = "https://github.com/neurwerk/k8s_stack_tooling"

[tool.hatch.build.targets.wheel]
packages = ["src/docling_tester"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.15.17", "ty>=0.0.49"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/docling_tester/upstream"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ty.rules]
all = "error"

[tool.ty.src]
exclude = ["src/docling_tester/upstream"]
