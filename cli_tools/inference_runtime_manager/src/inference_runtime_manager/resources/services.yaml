tts-german:
  recipes:
    - runtime: kokoro-onnx
      service: tts-german-kokoro
      model_id: kokoro-german-martin
      variant_id: onnx
      enabled: true
      default: true
      estimated_vram_gib: 0
      internal_port: 8881
      health_path: /health
      transport: python
      capabilities: []
      required_files:
        - kokoro-martin.onnx
        - voices-martin.npz
        - german_text_rules.py
        - onnx-docker/tts_normalizer.py
    - runtime: chatterbox
      service: tts-german
      model_id: chatterbox-multilingual-v2
      variant_id: pytorch-v2
      enabled: true
      default: false
      cache_repo: ResembleAI/chatterbox
      estimated_vram_gib: 4
      internal_port: 8004
      health_path: /api/model-info
      transport: python3
      capabilities: [voice_cloning]
      required_files: [t3_mtl23ls_v2.safetensors, s3gen.pt, ve.pt, conds.pt]
