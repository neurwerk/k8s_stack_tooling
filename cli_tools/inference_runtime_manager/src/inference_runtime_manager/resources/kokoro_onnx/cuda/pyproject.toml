[project]
name = "inference-kokoro-onnx-cuda-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "anyio==4.15.1",
  "fastapi==0.116.1",
  "kokoro-onnx==0.5.0",
  "numpy==2.3.3",
  "onnxruntime-gpu[cuda,cudnn]==1.22.0",
  "nvidia-cudnn-cu12==9.10.2.21",
  "uvicorn[standard]==0.35.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# GPU and CPU wheels share the onnxruntime module. Replace Kokoro's CPU
# dependency on Linux with the explicit GPU dependency above.
override-dependencies = ["onnxruntime; sys_platform == 'darwin'"]
