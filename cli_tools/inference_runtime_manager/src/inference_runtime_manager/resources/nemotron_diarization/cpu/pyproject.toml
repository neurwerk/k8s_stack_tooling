[project]
name = "inference-nemotron-diarization-cpu"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.116.1",
  "librosa==0.11.0",
  "numpy==2.3.3",
  "torch==2.9.1",
  "transformers==5.22.1",
  "uvicorn[standard]==0.35.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
