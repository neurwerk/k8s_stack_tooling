[project]
name = "docling-standard-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.23.0",
  "docling-ibm-models==4.0.4",
  "rapidocr==3.10.0",
  "numpy==2.5.5",
  "pillow==13.0.0",
  "safetensors==0.8.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
