name: local-ai

x-common: &common
  pull_policy: never
  platform: linux/amd64
  init: true
  restart: unless-stopped
  volumes:
    - models:/models:ro
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

x-gpu: &gpu
  gpus: all
  environment:
    NVIDIA_DRIVER_CAPABILITIES: compute,utility

services:
  vlm-documents:
    <<: [*common, *gpu]
    image: ${VLLM_IMAGE:?Run inference-runtime-manager images and install first}
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        python3 -m pip uninstall -y nixl nixl-cu12 nixl-cu13 >/dev/null &&
        if [ -n "$$VLM_DOCUMENTS_API_KEY" ]; then export VLLM_API_KEY="$$VLM_DOCUMENTS_API_KEY"; else unset VLLM_API_KEY; fi &&
        exec vllm serve "$@"
      - --
      - /models/active/vlm-documents
      - --served-model-name
      - vlm-documents
      - --dtype
      - ${VLLM_GRANITE_DTYPE:-float32}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --limit-mm-per-prompt.image
      - "1"
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - ${VLLM_GRANITE_GPU_MEMORY_UTILIZATION:-0.25}
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${VLM_DOCUMENTS_PORT:-8000}:8000"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLM_DOCUMENTS_API_KEY: ${VLM_DOCUMENTS_API_KEY-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 12

  llm-general:
    <<: [*common, *gpu]
    image: ${LLAMACPP_IMAGE:?Run inference-runtime-manager images and install first}
    command:
      - --model
      - /models/active/llm-general/Qwen3-4B-Q4_K_M.gguf
      - --alias
      - llm-general
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ctx-size
      - "4096"
      - --n-gpu-layers
      - "999"
      - --jinja
      - --parallel
      - "1"
      - --offline
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${LLM_GENERAL_PORT:-8001}:8000"
    environment:
      LLAMA_API_KEY: ${LLM_GENERAL_API_KEY-}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8000/health]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 8

  vlm-general:
    <<: [*common, *gpu]
    image: ${LLAMACPP_IMAGE:?Run inference-runtime-manager images and install first}
    command:
      - --model
      - /models/active/vlm-general/Qwen3VL-8B-Instruct-Q4_K_M.gguf
      - --mmproj
      - /models/active/vlm-general/mmproj-Qwen3VL-8B-Instruct-F16.gguf
      - --alias
      - vlm-general
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ctx-size
      - "4096"
      - --n-gpu-layers
      - "999"
      - --jinja
      - --parallel
      - "1"
      - --offline
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${VLM_GENERAL_PORT:-8002}:8000"
    environment:
      LLAMA_API_KEY: ${VLM_GENERAL_API_KEY-}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8000/health]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 12

  vlm-images:
    <<: [*common, *gpu]
    image: ${VLLM_IMAGE:?Run inference-runtime-manager images and install first}
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        python3 -m pip uninstall -y nixl nixl-cu12 nixl-cu13 >/dev/null &&
        if [ -n "$$VLM_IMAGES_API_KEY" ]; then export VLLM_API_KEY="$$VLM_IMAGES_API_KEY"; else unset VLLM_API_KEY; fi &&
        exec vllm serve "$@"
      - --
      - /models/active/vlm-images
      - --served-model-name
      - vlm-images
      - --dtype
      - float32
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --limit-mm-per-prompt.image
      - "1"
      - --mm-processor-cache-gb
      - "0"
      - --no-enable-prefix-caching
      - --max-num-seqs
      - "1"
      - --max-model-len
      - "4096"
      - --override-generation-config
      - '{"repetition_penalty":1.1}'
      - --gpu-memory-utilization
      - ${VLLM_IMAGES_GPU_MEMORY_UTILIZATION:-0.36}
      - --enforce-eager
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${VLM_IMAGES_PORT:-8007}:8000"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLM_IMAGES_API_KEY: ${VLM_IMAGES_API_KEY-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "0"
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 12

  vlm-images-olmocr:
    <<: [*common, *gpu]
    image: ${LLAMACPP_OCR_PROXY_IMAGE:?Run inference-runtime-manager images and install first}
    command:
      - --profile
      - olmocr
      - --
      - /app/llama-server
      - --model
      - /models/active/vlm-images/allenai_olmOCR-2-7B-1025-Q6_K.gguf
      - --mmproj
      - /models/active/vlm-images/mmproj-allenai_olmOCR-2-7B-1025-f16.gguf
      - --alias
      - vlm-images
      - --host
      - 127.0.0.1
      - --port
      - "8001"
      - --ctx-size
      - "16384"
      - --repeat-penalty
      - "1.1"
      - --repeat-last-n
      - "256"
      - --n-gpu-layers
      - "999"
      - --jinja
      - --parallel
      - "1"
      - --offline
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${VLM_IMAGES_PORT:-8007}:8000"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLM_IMAGES_API_KEY: ${VLM_IMAGES_API_KEY-}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 240s
      retries: 16

  vlm-images-nanonets:
    <<: [*common, *gpu]
    image: ${VLLM_OCR_PROXY_IMAGE:?Run inference-runtime-manager images and install first}
    command:
      - --profile
      - nanonets
      - --
      - vllm
      - serve
      - /models/active/vlm-images
      - --served-model-name
      - vlm-images
      - --dtype
      - float16
      - --host
      - 127.0.0.1
      - --port
      - "8001"
      - --limit-mm-per-prompt.image
      - "1"
      - --mm-processor-cache-gb
      - "0"
      - --no-enable-prefix-caching
      - --max-num-seqs
      - "1"
      - --max-model-len
      - "8192"
      - --override-generation-config
      - '{"repetition_penalty":1.1}'
      - --gpu-memory-utilization
      - ${VLLM_NANONETS_GPU_MEMORY_UTILIZATION:-0.65}
      - --enforce-eager
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${VLM_IMAGES_PORT:-8007}:8000"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLM_IMAGES_API_KEY: ${VLM_IMAGES_API_KEY-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "0"
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 300s
      retries: 20

  stt-general:
    <<: [*common, *gpu]
    image: ${SPEACHES_IMAGE:?Run inference-runtime-manager images and install first}
    command:
      - /bin/sh
      - -c
      - cp /runtime-config/model_aliases.json /home/ubuntu/speaches/model_aliases.json && if [ -n "$$STT_GENERAL_API_KEY" ]; then export API_KEY="$$STT_GENERAL_API_KEY"; else unset API_KEY; fi && exec uvicorn --factory speaches.main:create_app
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${STT_GENERAL_PORT:-8003}:8000"
    volumes:
      - models:/models:ro
      - runtime-config:/runtime-config:ro
    environment:
      STT_GENERAL_API_KEY: ${STT_GENERAL_API_KEY-}
      ENABLE_UI: "false"
      HF_HOME: /models/cache
      HF_HUB_CACHE: /models/cache/hub
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__COMPUTE_TYPE: float16
      WHISPER__NUM_WORKERS: "1"
      WHISPER__TTL: "-1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 8

  tts-german:
    <<: [*common, *gpu]
    image: ${CHATTERBOX_IMAGE:?Run inference-runtime-manager images and install first}
    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p /tmp/voices /tmp/reference_audio /tmp/outputs &&
        cp /app/voices/Emily.wav /tmp/voices/default &&
        cp /runtime-config/chatterbox.yaml /app/config.yaml &&
        exec python3 server.py
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${TTS_GERMAN_PORT:-8004}:8004"
    volumes:
      - models:/models:ro
      - runtime-config:/runtime-config:ro
    environment:
      HF_HOME: /models/cache
      HF_HUB_CACHE: /models/cache/hub
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      API_KEY: ${TTS_GERMAN_API_KEY-}
    healthcheck:
      test: [CMD, python3, -c, "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8004/api/model-info', timeout=5)); assert data.get('loaded') is True"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 12

  tts-german-kokoro:
    <<: *common
    image: ${KOKORO_IMAGE:?Run inference-runtime-manager images and install first}
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${TTS_GERMAN_PORT:-8004}:8881"
    environment:
      KOKORO_MODEL_ROOT: /models/active/tts-german
      API_KEY: ${TTS_GERMAN_API_KEY-}
      KOKORO_ONNX_INTRA_OP_THREADS: "4"
      KOKORO_ONNX_INTER_OP_THREADS: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8881/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  vad-general:
    <<: *common
    image: ${SPEACHES_IMAGE:?Run inference-runtime-manager images and install first}
    command:
      - /bin/sh
      - -c
      - cp /runtime-config/model_aliases.json /home/ubuntu/speaches/model_aliases.json && if [ -n "$$VAD_GENERAL_API_KEY" ]; then export API_KEY="$$VAD_GENERAL_API_KEY"; else unset API_KEY; fi && exec uvicorn --factory speaches.main:create_app
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${VAD_GENERAL_PORT:-8005}:8000"
    volumes:
      - models:/models:ro
      - runtime-config:/runtime-config:ro
    environment:
      VAD_GENERAL_API_KEY: ${VAD_GENERAL_API_KEY-}
      ENABLE_UI: "false"
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VAD_MODEL_TTL: "-1"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 8

  ner-german:
    <<: [*common, *gpu]
    image: ${KSERVE_IMAGE:?Run inference-runtime-manager images and install first}
    entrypoint:
      - python3
      - -c
      - "import runpy, sys, torch; sys.exit('NER requires a visible CUDA device') if not torch.cuda.is_available() else None; sys.argv = ['huggingfaceserver', *sys.argv[1:]]; runpy.run_module('huggingfaceserver', run_name='__main__')"
    command:
      - --model_name=ner-german
      - --model_dir=/models/active/ner-german
      - --task=token_classification
      - --backend=huggingface
      - --dtype=${NER_GERMAN_DTYPE:-float32}
      - --return_probabilities
      - --max_model_len=512
      - --disable_log_requests
      - --http_port=8080
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${NER_GERMAN_PORT:-8006}:8080"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      API_KEY: ${NER_GERMAN_API_KEY-}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/models/ner-german', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 12

  ner-english:
    <<: [*common, *gpu]
    image: ${KSERVE_IMAGE:?Run inference-runtime-manager images and install first}
    entrypoint:
      - python3
      - -c
      - "import runpy, sys, torch; sys.exit('NER requires a visible CUDA device') if not torch.cuda.is_available() else None; sys.argv = ['huggingfaceserver', *sys.argv[1:]]; runpy.run_module('huggingfaceserver', run_name='__main__')"
    command:
      - --model_name=ner-english
      - --model_dir=/models/active/ner-english
      - --task=token_classification
      - --backend=huggingface
      - --dtype=${NER_ENGLISH_DTYPE:-float32}
      - --return_probabilities
      - --max_model_len=512
      - --disable_log_requests
      - --http_port=8080
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${NER_ENGLISH_PORT:-8008}:8080"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      API_KEY: ${NER_ENGLISH_API_KEY-}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/models/ner-english', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 12

  ner-german-gliner:
    <<: [*common, *gpu]
    image: ${GLINER_IMAGE:?Run inference-runtime-manager images and install first}
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${NER_GERMAN_PORT:-8006}:8080"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      GLINER_MODEL_NAME: ner-german
      GLINER_MODEL_DIR: /models/active/ner-german
      GLINER_DTYPE: ${NER_GERMAN_DTYPE:-float32}
      GLINER_LABELS: ${GLINER_LABELS:-["person","email","phone number","address"]}
      GLINER_THRESHOLD: ${GLINER_THRESHOLD:-0.5}
      GLINER_API_KEY: ${NER_GERMAN_API_KEY-}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 12

  ner-english-gliner:
    <<: [*common, *gpu]
    image: ${GLINER_IMAGE:?Run inference-runtime-manager images and install first}
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${NER_ENGLISH_PORT:-8008}:8080"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      GLINER_MODEL_NAME: ner-english
      GLINER_MODEL_DIR: /models/active/ner-english
      GLINER_DTYPE: ${NER_ENGLISH_DTYPE:-float32}
      GLINER_LABELS: ${GLINER_LABELS:-["person","email","phone number","address"]}
      GLINER_THRESHOLD: ${GLINER_THRESHOLD:-0.5}
      GLINER_API_KEY: ${NER_ENGLISH_API_KEY-}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 12

  ner-multilingual-gliner:
    <<: [*common, *gpu]
    image: ${GLINER_IMAGE:?Run inference-runtime-manager images and install first}
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${NER_MULTILINGUAL_PORT:-8009}:8080"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      GLINER_MODEL_NAME: ner-multilingual
      GLINER_MODEL_DIR: /models/active/ner-multilingual
      GLINER_DTYPE: ${NER_MULTILINGUAL_DTYPE:-float32}
      GLINER_LABELS: ${GLINER_LABELS:-["person","email","phone number","address"]}
      GLINER_THRESHOLD: ${GLINER_THRESHOLD:-0.5}
      GLINER_API_KEY: ${NER_MULTILINGUAL_API_KEY-}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 12

  setup:
    profiles: [setup]
    image: ${SETUP_IMAGE:?Run inference-runtime-manager images and install first}
    pull_policy: never
    platform: linux/amd64
    entrypoint: [python, -c]
    restart: "no"
    volumes:
      - models:/models
      - runtime-config:/runtime-config

volumes:
  models: {name: local-ai_models}
  runtime-config: {name: inference-runtime-manager_config}
