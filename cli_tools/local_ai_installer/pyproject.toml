[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-ai-installer"
version = "0.1.1"
description = "Download verified models and provision a stock LocalAI Docker host."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0", "pydantic-settings>=2.0", "PyYAML>=6.0",
  "questionary>=2.1", "rich>=14.0",
]

[project.scripts]
local-ai-installer = "local_ai_installer.cli:main"

[project.urls]
Repository = "https://github.com/neurwerk/k8s_stack_tooling"

[tool.hatch.build.targets.wheel]
packages = ["src/local_ai_installer"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.15.17", "ty>=0.0.49"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
addopts = "-v --tb=short --cov=local_ai_installer.downloader --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 80
