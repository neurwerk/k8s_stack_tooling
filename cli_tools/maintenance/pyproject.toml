[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "platform-maintenance"
version = "0.1.0"
description = "Operate persistent platform maintenance routes from a trusted workstation."
readme = "README.md"
authors = [{ name = "neurwerk", email = "dev@neurwerk.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kubectl-maintenance = "maintenance.main:main"
maintenance = "maintenance.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maintenance"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.15.17", "ty>=0.0.49"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C90", "BLE", "G", "S", "ANN", "D",
    "RUF", "FA", "SIM", "RET", "PTH", "C4", "TRY", "T20",
]
ignore = ["D203", "D212", "TRY003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S", "T20", "TRY003"]
"**/__init__.py" = ["D104"]
# Fixed resolved kubectl executable, JSON stdin, and operator-facing output.
"src/maintenance/main.py" = ["S603", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["maintenance"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-literal-narrowing = true

[tool.pytest.ini_options]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
